name: Weekly IPTV Update

on:
  schedule:
    # Her Pazar saat 00:00'da çalışır
    - cron: '0 0 * * 0'
  workflow_dispatch: # Manuel olarak tetiklemek için

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python update_iptv.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add turkish_channels.m3u
          git commit -m "Weekly IPTV list update [automated]" || echo "No changes to commit"
          git push
